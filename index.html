<!DOCTYPE html>
<html lang="ja" data-ui="phone">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2b33" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ダメ計" />
  <link rel="icon" type="image/png" href="./icons/icon.png" />
  <link rel="apple-touch-icon" href="./icons/icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>ダメ計</title>
  <link rel="stylesheet" href="./css/style.css?v=20260920c" />
  <link rel="stylesheet" href="./css/hub.css?v=20260920c" />
</head>
<body class="tools-page">
  <div class="hub-app">
    <header class="app-header">
      <img class="app-icon" src="./icons/icon.png" alt="" width="36" height="36" />
      <div class="titles">
        <h1>ダメ計</h1>
        <p>攻撃側を1回入れる → 構築6匹まとめて計算</p>
      </div>
      <nav class="hub-nav">
        <a href="./team.html">構築</a>
        <a href="./index.html" aria-current="page">ダメ計</a>
        <div class="ui-toggle" title="表示サイズ">
          <button type="button" data-ui-set="phone">スマホ</button>
          <button type="button" data-ui-set="ipad">iPad</button>
        </div>
        <div class="result-mini" id="result-mini">未計算</div>
      </nav>
    </header>

    <div class="team-toolbar">
      <label class="field-label" for="team-slot">受け側の構築</label>
      <select id="team-slot" aria-label="構築選択"></select>
      <button type="button" class="icon-btn" id="btn-edit-team">構築を編集</button>
    </div>

    <div class="calc-layout">
      <section class="calc-attacker">
        <h2>攻撃側</h2>
        <div class="poke-slot" id="atk-slot" tabindex="0" role="button">＋ 攻撃ポケモンを選ぶ</div>
        <div id="atk-detail" class="poke-detail" hidden></div>

        <div class="mid-row" style="margin-top:8px;display:grid;gap:6px;grid-template-columns:1fr 1fr">
          <button type="button" class="selector-btn" id="move-btn">
            <div class="k">使う技</div>
            <div class="title">技を選択</div>
          </button>
          <button type="button" class="selector-btn" id="atk-item-btn">
            <div class="k">攻撃持ち物</div>
            <div class="title">なし</div>
          </button>
        </div>

        <div class="field-compact">
          <label>天候<select id="weather">
            <option value="なし">なし</option>
            <option value="はれ">晴れ</option>
            <option value="あめ">雨</option>
            <option value="すなあらし">砂</option>
            <option value="ゆき">雪</option>
          </select></label>
          <label>場<select id="field">
            <option value="なし">なし</option>
            <option value="エレキフィールド">エレキ</option>
            <option value="グラスフィールド">グラス</option>
            <option value="サイコフィールド">サイコ</option>
            <option value="ミストフィールド">ミスト</option>
          </select></label>
          <label>攻異常<select id="atk-status">
            <option value="なし">なし</option>
            <option value="やけど">やけど</option>
            <option value="どく">どく</option>
            <option value="もうどく">もうどく</option>
            <option value="まひ">まひ</option>
          </select></label>
          <label>まきびし<select id="spikes">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select></label>
        </div>

        <div class="check-list compact">
          <label><input type="checkbox" id="critical" />急所</label>
          <label><input type="checkbox" id="reflect" />リフレク</label>
          <label><input type="checkbox" id="lightScreen" />光の壁</label>
          <label><input type="checkbox" id="auroraVeil" />ベール</label>
          <label><input type="checkbox" id="stealthRock" />ステロ</label>
          <label><input type="checkbox" id="leechSeed" />やどりぎ</label>
          <label><input type="checkbox" id="burnChip" />やけどD</label>
          <label><input type="checkbox" id="poisonChip" />どくD</label>
          <label><input type="checkbox" id="gravity" />重力</label>
          <label><input type="checkbox" id="helpBoost" />てだすけ</label>
          <label><input type="checkbox" id="hpNotFull" />相手HP非満タン</label>
          <label><input type="checkbox" id="movingLast" />後攻(アナライズ)</label>
        </div>
      </section>

      <section class="calc-results">
        <h2 id="results-title">対 構築（6匹まとめて）</h2>
        <div class="bulk-results" id="bulk-results">
          <p class="hint">攻撃側のポケモンと技を選ぶと、構築の全員分がここに出ます</p>
        </div>
      </section>
    </div>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">選択</h3>
        <button type="button" class="icon-btn" id="modal-close">閉じる</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="./js/calc-app.js?v=20260920c"></script>
</body>
</html>

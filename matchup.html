<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2b33" />
  <title>対面マトリクス | ダメ計</title>
  <link rel="icon" type="image/png" href="./icons/icon.png" />
  <link rel="stylesheet" href="./css/style.css?v=20260919e" />
  <link rel="stylesheet" href="./css/tools.css?v=20260919e" />
</head>
<body class="tools-page">
  <div class="app tools-app">
    <header class="app-header">
      <img class="app-icon" src="./icons/icon.png" alt="" width="36" height="36" />
      <div class="titles">
        <h1>対面マトリクス</h1>
        <p>自分6×相手6 — 育成済み技の％／確定数。セルでダメ計へ</p>
      </div>
      <nav class="tool-nav">
        <a href="./index.html">ダメ計</a>
        <a href="./team.html">パーティ</a>
        <a href="./matchup.html" aria-current="page">対面</a>
        <a href="./battle.html">対戦</a>
      </nav>
    </header>

    <div class="matchup-layout">
      <div class="matchup-pickers">
        <label>自分
          <select id="mine-select"></select>
        </label>
        <label>相手
          <select id="foe-select"></select>
        </label>
        <button type="button" class="icon-btn primary" id="btn-calc">再計算</button>
      </div>
      <div class="matrix-wrap">
        <table class="matrix" id="matrix">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
      <section class="notes-box panel" style="padding:10px">
        <h2 style="margin:0 0 6px;font-size:0.95rem">選出メモ</h2>
        <textarea id="notes" placeholder="例: 先発はカイリュー。相手カバいるならステロ→積み枠…"></textarea>
        <div style="margin-top:6px">
          <button type="button" class="icon-btn" id="btn-save-note">メモ保存</button>
          <a class="icon-btn" href="./battle.html" style="display:inline-block;text-decoration:none">この対面で対戦へ</a>
        </div>
      </section>
    </div>
  </div>
  <script type="module" src="./js/matchup-app.js?v=20260919e"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja" data-ui="phone">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2b33" />
  <title>努力値逆算 | ダメ計</title>
  <link rel="icon" type="image/png" href="./icons/icon.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/style.css?v=20260920n" />
  <link rel="stylesheet" href="./css/hub.css?v=20260920n" />
  <link rel="stylesheet" href="./css/type-icons.css?v=20260920h" />
</head>
<body class="tools-page">
  <div class="hub-app">
    <header class="app-header">
      <a class="app-icon-link" href="./index.html" title="ホーム"><img class="app-icon" src="./icons/icon.png" alt="Poketool" width="36" height="36" /></a>
      <div class="titles">
        <h1>努力値逆算</h1>
        <p>観測ダメージから相手の努力値帯と性格補正を推定</p>
      </div>
      <nav class="hub-nav">
        <a href="./index.html" class="nav-home">ホーム</a>
        <a href="./reverse.html" aria-current="page">逆算</a>
        <div class="ui-toggle">
          <button type="button" data-ui-set="phone">スマホ</button>
          <button type="button" data-ui-set="ipad">iPad</button>
        </div>
      </nav>
    </header>

    <div class="team-toolbar">
      <label class="field-label" for="team-slot">自分の構築</label>
      <select id="team-slot"></select>
    </div>

    <section class="calc-attacker">
      <h2>1. 自分のポケモン</h2>
      <div class="rev-mine-grid" id="my-pick"></div>
    </section>

    <section class="calc-attacker" style="margin-top:10px">
      <h2>2. 向き・相手・技</h2>
      <label class="field-label" for="rev-mode">逆算の向き</label>
      <select id="rev-mode">
        <option value="offense">相手に殴られた → 相手の A/C</option>
        <option value="defense">自分が殴った → 相手の H+B/D</option>
      </select>
      <div id="foe-slot" style="margin-top:8px"></div>
      <button type="button" class="selector-btn" id="btn-move" style="margin-top:8px;width:100%">
        <div class="k">技</div>
        <div class="title">技を選択</div>
      </button>
    </section>

    <section class="calc-attacker" style="margin-top:10px">
      <h2>3. 観測ダメージ・条件</h2>
      <label class="field-label" for="observed-dmg">観測ダメージ（例: 72　または　68-80）</label>
      <input type="text" id="observed-dmg" inputmode="numeric" placeholder="72" style="width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:1.1rem;font-weight:800" />

      <div class="field-compact">
        <label>天候<select id="weather">
          <option value="なし">なし</option>
          <option value="はれ">晴れ</option>
          <option value="あめ">雨</option>
          <option value="すなあらし">砂</option>
          <option value="ゆき">雪</option>
        </select></label>
        <label>場<select id="field">
          <option value="なし">なし</option>
          <option value="エレキフィールド">エレキ</option>
          <option value="グラスフィールド">グラス</option>
          <option value="サイコフィールド">サイコ</option>
          <option value="ミストフィールド">ミスト</option>
        </select></label>
        <label>攻撃側異常<select id="atk-status">
          <option value="なし">なし</option>
          <option value="やけど">やけど</option>
          <option value="まひ">まひ</option>
        </select></label>
      </div>
      <div class="check-list compact">
        <label><input type="checkbox" id="critical" />急所</label>
        <label><input type="checkbox" id="reflect" />リフレク</label>
        <label><input type="checkbox" id="lightScreen" />光の壁</label>
        <label><input type="checkbox" id="auroraVeil" />ベール</label>
        <label><input type="checkbox" id="helpBoost" />てだすけ</label>
        <label><input type="checkbox" id="gravity" />重力</label>
        <label><input type="checkbox" id="hpNotFull" />相手HP非満タン</label>
        <label><input type="checkbox" id="movingLast" />後攻</label>
      </div>
      <button type="button" class="icon-btn primary" id="btn-run" style="width:100%;margin-top:10px;min-height:48px;font-size:1rem">逆算する</button>
    </section>

    <section class="calc-results" style="margin-top:10px">
      <h2>結果</h2>
      <div id="rev-results">
        <p class="hint">例: 努力値 A28~32　性格 A×1.1↑</p>
      </div>
    </section>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">選択</h3>
        <button type="button" class="icon-btn" id="modal-close">閉じる</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="./js/reverse-app.js?v=20260920h"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja" data-ui="phone">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2b33" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>対戦シミュ | ダメ計</title>
  <link rel="icon" type="image/png" href="./icons/icon.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/style.css?v=20260922c" />
  <link rel="stylesheet" href="./css/hub.css?v=20260922c" />
  <link rel="stylesheet" href="./css/type-icons.css?v=20260922c" />
  <link rel="stylesheet" href="./css/tools.css?v=20260922f" />
</head>
<body class="tools-page">
  <div class="hub-app">
    <header class="app-header">
      <a class="app-icon-link" href="./index.html" title="ホーム">
        <img class="app-icon" src="./icons/icon.png" alt="Poketool" width="36" height="36" />
      </a>
      <div class="titles">
        <h1>対戦シミュ</h1>
        <p>自分の構築 vs AI　Phase 4 完成版</p>
      </div>
      <nav class="hub-nav">
        <a href="./index.html" class="nav-home">ホーム</a>
        <a href="./battle.html" aria-current="page">対戦</a>
</nav>
    </header>

    <div class="battle-shell" id="setup-panel">
      <section class="calc-attacker">
        <h2>自分の構築</h2>
        <p class="hint">あなたの構築1つを使います。相手はAIが努力値・持ち物・技を組んだ6匹です。</p>
        <div style="margin-top:8px">
          <div class="field-label">構築</div>
          <select id="mine-select" aria-label="自分の構築"></select>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="icon-btn primary" id="btn-start-select">選出へ</button>
          <a class="icon-btn" href="./team.html">構築を編集</a>
        </div>
      </section>
    </div>

    <div class="battle-shell" id="select-panel" hidden>
      <section class="calc-attacker">
        <h2>3匹選出</h2>
        <p class="hint">自分の構築から3匹を選んでください。相手は下のAI構築から3匹を自動選出します。</p>
        <div class="select-row" id="select-chips"></div>
        <div id="foe-preview" style="margin-top:12px"></div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="icon-btn primary" id="btn-start-battle" disabled>試合開始</button>
          <button type="button" class="icon-btn" id="btn-reroll-foe">相手を再生成</button>
          <button type="button" class="icon-btn" id="btn-back-setup">戻る</button>
        </div>
      </section>
    </div>

    <div class="battle-shell" id="fight-panel" hidden>
      <div class="battle-arena">
        <div class="battle-field-status" id="battle-field-status"></div>
        <div class="battle-side foe" id="foe-side">
          <div class="battle-mon">
            <div class="battle-mon-info">
              <div class="battle-name-row">
                <strong id="foe-name">—</strong>
                <span id="foe-hp-text" class="battle-hp-text"></span>
              </div>
              <div class="hp-bar" id="foe-hp"><span style="width:100%"></span></div>
              <div class="battle-meta" id="foe-status"></div>
              <div class="battle-party-dots" id="foe-dots"></div>
            </div>
            <div class="battle-sprite" id="foe-sprite"></div>
          </div>
        </div>

        <div class="battle-side player" id="player-side">
          <div class="battle-mon">
            <div class="battle-sprite" id="player-sprite"></div>
            <div class="battle-mon-info">
              <div class="battle-name-row">
                <strong id="player-name">—</strong>
                <span id="player-hp-text" class="battle-hp-text"></span>
              </div>
              <div class="hp-bar" id="player-hp"><span style="width:100%"></span></div>
              <div class="battle-meta" id="player-status"></div>
              <div class="battle-party-dots" id="player-dots"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="battle-cmd">
        <div id="move-actions" class="battle-actions"></div>
        <div id="switch-actions" class="select-row" style="margin-top:8px"></div>
        <div style="margin-top:8px">
          <button type="button" class="icon-btn" id="btn-reset">試合をやめる</button>
        </div>
      </div>

      <div class="battle-log" id="battle-log" aria-live="polite"></div>
    </div>
  </div>

  <script type="module" src="./js/battle-app.js?v=20260922f"></script>
</body>
</html>

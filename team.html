<!DOCTYPE html>
<html lang="ja" data-ui="phone">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2b33" />
  <title>構築 | ダメ計</title>
  <link rel="icon" type="image/png" href="./icons/icon.png" />
  <link rel="stylesheet" href="./css/style.css?v=20260920e" />
  <link rel="stylesheet" href="./css/hub.css?v=20260920e" />
  <link rel="stylesheet" href="./css/type-icons.css?v=20260920e" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body class="tools-page">
  <div class="hub-app">
    <header class="app-header">
      <img class="app-icon" src="./icons/icon.png" alt="" width="36" height="36" />
      <div class="titles">
        <h1>構築</h1>
        <p>枠をタップして1匹ずつ育成</p>
      </div>
      <nav class="hub-nav">
        <a href="./team.html" aria-current="page">構築</a>
        <a href="./index.html">ダメ計</a>
        <div class="ui-toggle" title="表示サイズ">
          <button type="button" data-ui-set="phone">スマホ</button>
          <button type="button" data-ui-set="ipad">iPad</button>
        </div>
      </nav>
    </header>

    <section id="view-list">
      <div class="slot-tabs" id="slot-tabs"></div>

      <div class="team-toolbar">
        <input type="text" id="team-name" placeholder="構築名" maxlength="40" />
        <button type="button" class="icon-btn primary" id="btn-save">保存</button>
        <button type="button" class="icon-btn primary" id="btn-overview">構築概要</button>
        <button type="button" class="icon-btn danger" id="btn-clear">この構築を空に</button>
      </div>

      <div class="memo-block">
        <label for="team-memo">メモ（自由記述）</label>
        <textarea id="team-memo" placeholder="選出順・対面メモ・注意点など"></textarea>
      </div>

      <p class="hint">空き枠／ポケモンをタップ → 育成画面へ</p>
      <div class="roster-list" id="roster-list"></div>
    </section>

    <section id="view-train" hidden>
      <div class="train-bar">
        <button type="button" class="icon-btn" id="btn-back-list">← 構築に戻る</button>
        <strong id="train-title">育成</strong>
        <button type="button" class="icon-btn danger" id="btn-remove-member">枠を空に</button>
      </div>
      <div id="train-body"></div>
    </section>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">選択</h3>
        <button type="button" class="icon-btn" id="modal-close">閉じる</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="./js/team-app.js?v=20260920e"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja" data-ui="phone">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2b33" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>ダメ計 | 攻撃・受け両対応</title>
  <link rel="icon" type="image/png" href="./icons/icon.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/style.css?v=20260922i" />
  <link rel="stylesheet" href="./css/hub.css?v=20260922i" />
  <link rel="stylesheet" href="./css/type-icons.css?v=20260922i" />
</head>
<body class="tools-page calc-page">
  <div class="hub-app">
    <header class="app-header">
      <a class="app-icon-link" href="./index.html" title="ホーム">
        <img class="app-icon" src="./icons/icon.png" alt="Poketool" width="36" height="36" />
      </a>
      <div class="titles">
        <h1>ダメ計</h1>
        <p>構築を攻撃側にも受け側にも置ける</p>
      </div>
      <nav class="hub-nav">
        <a href="./index.html" class="nav-home">ホーム</a>
        <a href="./dame.html" aria-current="page">ダメ計</a>
        <div class="result-mini" id="result-mini">-</div>
      </nav>
    </header>

    <div class="calc-layout">
      <div class="calc-main">
        <div class="team-toolbar">
          <label class="field-label" for="team-slot">自分の構築</label>
          <select id="team-slot" aria-label="構築選択"></select>
          <button type="button" class="icon-btn" id="btn-edit-team">構築を編集</button>
        </div>

        <div class="role-tabs" role="tablist" aria-label="構築の役割">
          <button type="button" class="role-tab on" data-role="atk" aria-selected="true">構築が攻撃</button>
          <button type="button" class="role-tab" data-role="def" aria-selected="false">構築が受け</button>
        </div>

        <section class="calc-panel">
          <div class="side-tabs" role="tablist">
            <button type="button" class="side-tab on" data-side="atk" role="tab" aria-selected="true">攻撃側</button>
            <button type="button" class="side-tab" data-side="def" role="tab" aria-selected="false">防御側</button>
          </div>

          <div id="side-atk" class="side-pane">
            <h2 class="sr-only">攻撃側</h2>
            <div id="atk-pick"></div>
            <div id="atk-detail" class="poke-detail"></div>
            <div class="mid-row">
              <button type="button" class="selector-btn" id="move-btn">
                <div class="k">使う技</div>
                <div class="title">技を選択</div>
              </button>
            </div>
          </div>

          <div id="side-def" class="side-pane" hidden>
            <h2 class="sr-only">防御側</h2>
            <div id="def-pick"></div>
            <div id="def-detail" class="poke-detail"></div>
          </div>
        </section>

        <section class="calc-panel field-panel">
          <h2>場・条件</h2>
          <div class="field-compact">
            <label>天候<select id="weather">
              <option value="なし">なし</option>
              <option value="はれ">晴れ</option>
              <option value="あめ">雨</option>
              <option value="すなあらし">砂</option>
              <option value="ゆき">雪</option>
            </select></label>
            <label>場<select id="field">
              <option value="なし">なし</option>
              <option value="エレキフィールド">エレキ</option>
              <option value="グラスフィールド">グラス</option>
              <option value="サイコフィールド">サイコ</option>
              <option value="ミストフィールド">ミスト</option>
            </select></label>
            <label>異常<select id="atk-status">
              <option value="なし">なし</option>
              <option value="やけど">やけど</option>
              <option value="まひ">まひ</option>
              <option value="どく">どく</option>
              <option value="もうどく">もうどく</option>
            </select></label>
            <label>まきびし<select id="spikes">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select></label>
          </div>
          <div class="check-list compact">
            <label><input type="checkbox" id="critical" />急所</label>
            <label><input type="checkbox" id="reflect" />リフレク</label>
            <label><input type="checkbox" id="lightScreen" />光の壁</label>
            <label><input type="checkbox" id="auroraVeil" />ベール</label>
            <label><input type="checkbox" id="stealthRock" />ステロ</label>
            <label><input type="checkbox" id="leechSeed" />やどりぎ</label>
            <label><input type="checkbox" id="burnChip" />やけどD</label>
            <label><input type="checkbox" id="poisonChip" />どくD</label>
            <label><input type="checkbox" id="gravity" />重力</label>
            <label><input type="checkbox" id="helpBoost" />てだすけ</label>
            <label><input type="checkbox" id="movingLast" />後攻(がんせき)</label>
          </div>
        </section>
      </div>

      <aside class="calc-results" id="calc-results">
        <div class="calc-results-head">
          <h2 id="results-title">ダメージ結果</h2>
          <button type="button" class="icon-btn results-toggle" id="btn-results-toggle" aria-label="結果を開閉">結果</button>
        </div>
        <div class="bulk-results" id="bulk-results">
          <p class="hint">攻撃側・技・防御側を選ぶとダメージが出ます</p>
        </div>
      </aside>
    </div>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">選択</h3>
        <button type="button" class="icon-btn" id="modal-close">閉じる</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="./js/calc-app.js?v=20260922j"></script>
</body>
</html>
